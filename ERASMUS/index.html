<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter - Erasmus Ljubljana</title>
    <!-- Embedded styles so this file looks correct even opened alone -->
    <style>
      *{margin:0;padding:0;box-sizing:border-box}
      body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh}
      /* Centered layout only for landing page */
      body.home{display:flex;justify-content:center;align-items:center;padding:20px}
      .container{background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:500px;width:100%;padding:40px;animation:fadeIn .5s ease-in}
      @keyframes fadeIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
      .logo{text-align:center;margin-bottom:30px}
      .logo h1{color:#667eea;font-size:2em;margin-bottom:10px}
      .logo p{color:#666;font-size:1.1em}
      .form-group{margin-bottom:25px}
      label{display:block;color:#333;font-weight:600;margin-bottom:8px;font-size:.95em}
      input{width:100%;padding:15px;border:2px solid #e0e0e0;border-radius:10px;font-size:1em;transition:all .3s ease}
      input:focus{outline:none;border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,.1)}
      .btn{width:100%;padding:15px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border:none;border-radius:10px;font-size:1.1em;font-weight:600;cursor:pointer;transition:all .3s ease;margin-top:10px}
      .btn:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(102,126,234,.3)}
      .btn:active{transform:translateY(0)}
      .btn:disabled{opacity:.6;cursor:not-allowed}
      .message{padding:15px;border-radius:10px;margin-bottom:20px;display:none;animation:slideIn .3s ease}
      @keyframes slideIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
      .message.success{background:#d4edda;color:#155724;border:1px solid #c3e6cb}
      .message.error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}
      .message.show{display:block}
      .features{margin-top:30px;padding-top:30px;border-top:2px solid #f0f0f0}
      .feature-item{display:flex;align-items:center;margin-bottom:15px;color:#666}
      .feature-icon{width:30px;height:30px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;margin-right:15px;font-weight:bold}
      .loader{border:3px solid #f3f3f3;border-top:3px solid #667eea;border-radius:50%;width:20px;height:20px;animation:spin 1s linear infinite;display:inline-block;margin-left:10px;vertical-align:middle}
      @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
      .privacy{text-align:center;margin-top:20px;font-size:.85em;color:#999}
    </style>
  </head>
<body class="home">
  <div class="container">
    <div class="logo">
      <h1>Erasmus Ljubljana</h1>
      <p>Join our community</p>
    </div>

    <div id="message" class="message"></div>

    <form id="subscribeForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="your@email.com" required>
      </div>

      <button type="submit" class="btn" id="submitBtn">Subscribe to Newsletter</button>
    </form>

    <div style="text-align:center;margin-top:14px">
      <a href="../login.php">Already subscribed? Access event reservations</a>
    </div>

    <div class="features">
      <div class="feature-item"><div class="feature-icon">?</div><span>Get exclusive events every week</span></div>
      <div class="feature-item"><div class="feature-icon">?</div><span>Priority access to parties</span></div>
      <div class="feature-item"><div class="feature-icon">?</div><span>Connect with international students</span></div>
    </div>

    <div class="privacy">Your information is safe with us</div>
  </div>

  <script>console.log("inline placeholder");</script>
</body>
</html>
