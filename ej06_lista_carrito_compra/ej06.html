<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOPPING LIST</title>
    <script defer type="text/javascript" src="ej06.js"></script>
    <link rel="stylesheet" href="estilos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</head>
<body>
<div class="container">
    <h1>My first $1M app</h1>
    <table id="tablaInput">
        <tr>                                       <!-- Placeholder para poner un texto por defecto hasta q escribes -->
            <td><input type="text" id="txtAdd" value="" placeholder="Escribe los productos aqui"></td>
            <td><input type="button" id="btnAdd" value="Add to shopping list"></td>
        </tr>
    </table>
    <br>
    <table>
        <thead>
        <tr>
            <th>My shopping list</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>
                <!-- ESTA ES LA LISTA -->
                <ul id="mylist"> 
                </ul>
            </td>
            <td>
                <input type="button" id="btnSelAll" value="Select all"><br>
                <input type="button" id="btnSelNot" value="Select nothing"><br>
                <input type="button" id="btnInvSel" value="Invert selection"><br>
                <input type="button" id="btnMovSel" value="Move selected to cart"><br>
                <input type="button" id="btnDelSel" value="Delete selected">
            </td>
        </tr>
        </tbody>
    </table>
    <br>
    <table>
        <thead>
        <tr>
            <th>My cart</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>
                
                <ul id="mycart">
                </ul>
            </td>
            <td>
                <input type="button" id="btnEmpCar" value="Empty cart"><br>
                <input type="button" id="btnAddUnitCar" value="Add Unit"><br>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
